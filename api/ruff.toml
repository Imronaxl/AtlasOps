target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",
    "UP017",
    "UP006",
    "UP007",
    "SIM117",
    "B008",
]

[lint.per-file-ignores]
"**/routes/*.py" = ["B008"]
"src/routes/*.py" = ["B008"]
"**/routes/**/*.py" = ["B008"]

[format]
quote-style = "double"
indent-style = "space"
