name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -v
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

  monitoring:
    name: Prometheus and Alertmanager config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check alert rules
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/p" --entrypoint promtool
          prom/prometheus:v2.55.1 check rules /p/alert.rules.yml
      - name: Unit-test alert rules
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/p" --entrypoint promtool
          prom/prometheus:v2.55.1 test rules /p/tests/alert_rules_test.yml
      - name: Check Alertmanager config
        run: >
          docker run --rm -v "$PWD/monitoring/alertmanager:/a" --entrypoint amtool
          prom/alertmanager:v0.27.0 check-config /a/config.yml

  lint:
    name: Shell, YAML and Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/*.sh
      - run: pip install yamllint && yamllint -c .yamllint docker-compose.yml monitoring/
      - run: docker compose config --quiet
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
          ignore: DL3008
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: nginx/Dockerfile

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [api, monitoring, lint]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api nginx

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r api/requirements.txt
