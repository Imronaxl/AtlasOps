groups:
  - name: infrastructure
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes. Current value: {{ $value | printf \"%.1f\" }}%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% for more than 5 minutes. Current value: {{ $value | printf \"%.1f\" }}%"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is above 85% for more than 5 minutes. Current value: {{ $value | printf \"%.1f\" }}%"

      # A container that reported in the last hour but not now. cAdvisor drops
      # the series of a stopped container, so absent() per name would need a
      # hard-coded list; comparing with the recent past does not.
      - alert: ContainerDown
        expr: |
          max by (name) (max_over_time(container_last_seen{name=~"infra-.+"}[1h]))
            unless on (name)
          max by (name) (container_last_seen{name=~"infra-.+"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "{{ $labels.name }} was running in the last hour and is no longer reported by cAdvisor."

      - alert: ContainerHighCPU
        expr: sum(rate(container_cpu_usage_seconds_total{name=~".+"}[5m])) by (name) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU"
          description: "Container CPU usage is above 80%. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: ContainerHighMemory
        # Containers without a memory limit report a limit of 0; skip them.
        expr: |
          container_memory_working_set_bytes{name=~".+"}
            / (container_spec_memory_limit_bytes{name=~".+"} > 0) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory"
          description: "Container memory usage is above 90% of limit."

      - alert: APILatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency is high"
          description: "API p95 latency is above 1 second for 5 minutes. Current: {{ $value | printf \"%.2f\" }}s"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} (job={{ $labels.job }}) has been down for more than 2 minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / 1073741824) < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Less than 5GB of disk space remaining. Current: {{ $value | printf \"%.1f\" }}GB"

  - name: services
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL is down"
          description: "postgres-exporter cannot connect to the database."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "redis-exporter cannot connect to Redis."

      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: "nginx is down"
          description: "nginx-exporter cannot read stub_status."

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of max_connections are in use."

  - name: network
    rules:
      - alert: HighNetworkInbound
        expr: rate(node_network_receive_bytes_total{device!~"lo|docker.*|br-.*|veth.*"}[5m]) * 8 > 100000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High inbound network traffic on {{ $labels.instance }}"
          description: "Network inbound traffic is above 100Mbps for 5 minutes."

      - alert: HighNetworkOutbound
        expr: rate(node_network_transmit_bytes_total{device!~"lo|docker.*|br-.*|veth.*"}[5m]) * 8 > 100000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High outbound network traffic on {{ $labels.instance }}"
          description: "Network outbound traffic is above 100Mbps for 5 minutes."
