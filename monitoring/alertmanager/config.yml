global:
  resolve_timeout: 5m

route:
  receiver: api
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: api
      group_wait: 10s
      repeat_interval: 1h

receivers:
  # The API stores every firing and resolved alert as an incident.
  # Add email, Slack or PagerDuty receivers next to it for real paging.
  - name: api
    webhook_configs:
      - url: http://api:8000/api/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/webhook_token

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["alertname", "instance"]
