global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password: "changeme"
  smtp_require_tls: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "default"
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "warning"
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "https://hooks.example.com/alerts"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "https://hooks.example.com/alerts"
        send_resolved: true

  - name: "warning"
    webhook_configs:
      - url: "https://hooks.example.com/alerts"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
